<!DOCTYPE html>
<html>
<head>
  <title>Todo List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 60px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }

    h1 { font-size: 1.8rem; color: #1a1a2e; margin-bottom: 24px; }

    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }

    #todo-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #todo-input:focus { border-color: #2e7d32; }

    #add-btn {
      padding: 10px 20px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #add-btn:hover { background: #1b5e20; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-btn {
      flex: 1;
      padding: 7px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: #555;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #2e7d32;
      color: #fff;
      border-color: #2e7d32;
    }

    #todo-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    #todo-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f1f8f1;
      border-radius: 8px;
      border: 1.5px solid #c8e6c9;
    }

    #todo-list li.completed {
      background: #2e7d32;
      border-color: #1b5e20;
    }

    #todo-list li.completed .todo-text {
      text-decoration: line-through;
      opacity: 0.85;
      color: #fff;
    }

    #todo-date {
      padding: 10px 10px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      color: #555;
    }

    #todo-date:focus { border-color: #2e7d32; }

    .todo-meta { display: flex; flex-direction: column; gap: 3px; flex: 1; cursor: pointer; }

    .due-date { font-size: 0.75rem; color: #777; }

    .due-date.overdue { color: #e53935; font-weight: 600; }

    #todo-list li.completed .due-date { color: rgba(255,255,255,0.7); }

    .actions { display: flex; gap: 6px; }

    .actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .actions button:last-child { color: #ff4d4d; }
    .actions button:last-child:hover { background: #ffe5e5; }
    .actions button:first-child:hover { background: #e8f5e9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>
    <div class="input-row">
      <input type="text" id="todo-input" placeholder="Enter a task">
      <input type="date" id="todo-date">
      <button id="add-btn">Add</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <ul id="todo-list"></ul>
  </div>
  <script type="module" src="./index.js"></script>
</body>
</html>
